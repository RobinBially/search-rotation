<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>search-rotation — Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="headrow">
    <div>
      <h1>search&#8209;rotation</h1>
      <div class="sub"><span data-i18n="sub.text"></span> · <span id="version"></span> · <code id="configpath"></code></div>
    </div>
    <select id="lang" aria-label="Sprache / Language">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="hi">हिन्दी</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
    </select>
  </div>
</header>
<main>
  <div id="notice" class="notice hidden"></div>

  <section>
    <h2><span data-i18n="search.title"></span> <small data-i18n="search.subtitle"></small></h2>
    <div id="search-engines" class="cards"></div>
  </section>

  <section>
    <h2><span data-i18n="fetch.title"></span> <small data-i18n="fetch.subtitle"></small></h2>
    <div id="fetch-engines" class="rows"></div>
  </section>

  <section id="history-section">
    <h2><span data-i18n="history.title"></span> <small data-i18n="history.subtitle"></small></h2>
    <div class="histbar"><button id="history-clear" data-i18n="history.clear"></button></div>
    <div id="history-list" class="histlist"><span class="muted" data-i18n="history.empty"></span></div>
  </section>

  <section>
    <h2 data-i18n="setup.title"></h2>
    <div class="snippets">
      <div class="snippet">
        <h3>Codex — <code>~/.codex/config.toml</code></h3>
        <pre id="snip-codex"></pre>
        <button data-copy="snip-codex" data-i18n="btn.copy"></button>
      </div>
      <div class="snippet">
        <h3>Claude Desktop / Claude Code</h3>
        <pre id="snip-claude"></pre>
        <button data-copy="snip-claude" data-i18n="btn.copy"></button>
      </div>
      <div class="snippet">
        <h3 data-i18n="snippet.remote"></h3>
        <pre id="snip-remote"></pre>
        <button data-copy="snip-remote" data-i18n="btn.copy"></button>
      </div>
    </div>
  </section>
</main>
<footer>
  <span data-i18n="footer.quota"></span> ·
  <button id="refresh" data-i18n="btn.refresh"></button> ·
  <span data-i18n="footer.auto"></span>
</footer>
<script src="/app.js"></script>
</body>
</html>
