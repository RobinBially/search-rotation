name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # Central maintenance publishes its already verified package itself.
    if: github.actor != vars.MAINTENANCE_BOT_LOGIN
    uses: ./.github/workflows/ci.yml

  release:
    name: Build GitHub release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs
      - name: Install dependencies and build
        run: npm ci
      - name: Pack and verify installation
        run: npm run smoke:package
      - name: Create release archive and checksums
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          cd release-artifacts
          sha256sum *.tgz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/*.tgz release-artifacts/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes --notes-file docs/release-notes.md
